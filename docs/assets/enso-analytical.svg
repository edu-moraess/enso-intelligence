<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">ANALYTICAL VIEW</text><text x="80" y="125" font-family="Arial,sans-serif" font-size="17" fill="#687684">Observed ENSO signal · seasonal reference · climate context</text><g font-family="Arial,sans-serif"><rect x="80" y="180" width="1410" height="300" rx="18" fill="#fff" stroke="#dbe2ea"/><text x="120" y="235" font-size="17" fill="#687684">RONI</text><text x="120" y="300" font-size="42" font-weight="700" fill="#17212b">+1.36 °C</text><text x="470" y="235" font-size="17" fill="#687684">ONI</text><text x="470" y="300" font-size="42" font-weight="700" fill="#17212b">+1.80 °C</text><text x="820" y="235" font-size="17" fill="#687684">Difference</text><text x="820" y="300" font-size="42" font-weight="700" fill="#17212b">−0.44 °C</text><line x1="120" y1="355" x2="1450" y2="355" stroke="#e5eaf0"/><text x="120" y="405" font-size="16" fill="#687684">RONI is the operational ENSO signal; ONI is shown as a complementary reference.</text><text x="120" y="435" font-size="16" fill="#687684">Observed indices are not forecasts and recent official values may be revised.</text><text x="80" y="560" font-size="16" font-weight="700" letter-spacing="2" fill="#687684">CLIMATE CONTEXT</text><rect x="80" y="595" width="430" height="165" rx="18" fill="#fff" stroke="#dbe2ea"/><text x="110" y="640" font-size="17" font-weight="700" fill="#17212b">Atmosphere</text><text x="110" y="675" font-size="15" fill="#687684">ENSO signal interpreted alongside</text><text x="110" y="700" font-size="15" fill="#687684">large-scale atmospheric coupling.</text><rect x="550" y="595" width="430" height="165" rx="18" fill="#fff" stroke="#dbe2ea"/><text x="580" y="640" font-size="17" font-weight="700" fill="#17212b">Precipitation &amp; Temperature</text><text x="580" y="675" font-size="15" fill="#687684">Observed ENSO phase provides</text><text x="580" y="700" font-size="15" fill="#687684">regional climate context.</text><rect x="1020" y="595" width="470" height="165" rx="18" fill="#fff" stroke="#dbe2ea"/><text x="1050" y="640" font-size="17" font-weight="700" fill="#17212b">Agriculture &amp; Water</text><text x="1050" y="675" font-size="15" fill="#687684">Contextual interpretation only;</text><text x="1050" y="700" font-size="15" fill="#687684">not validated impact prediction.</text></g></svg>