services:
  - type: cron
    name: enso-data-foundation
    runtime: python
    schedule: "17 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/run_external_data_foundation.py"
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: "edu-moraess/enso-intelligence"
      - key: GIT_BRANCH
        value: "main"
