name: ENSO Data Foundation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/data-foundation.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: enso-data-foundation
  cancel-in-progress: false

jobs:
  update-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.0,<3.0" "requests>=2.31,<3.0"

      - name: Verify repository runtime
        run: |
          python --version
          python -c "import pandas, requests; print('pandas', pandas.__version__); print('requests', requests.__version__)"

      - name: Ingest RONI
        run: |
          set -euxo pipefail
          python -c "from src.noaa.roni import fetch_roni; df, meta = fetch_roni(); print('RONI:', len(df), 'rows from', meta.url)"

      - name: Ingest ONI
        run: |
          set -euxo pipefail
          python -c "from src.noaa.cpc import fetch_oni; df, meta = fetch_oni(); print('ONI:', len(df), 'rows from', meta.url)"

      - name: Ingest weekly Niño regions
        run: |
          set -euxo pipefail
          python -c "from src.noaa.cpc import fetch_nino_indices; df, meta = fetch_nino_indices(); print('Weekly Niño:', len(df), 'rows from', meta.url)"

      - name: Build and validate NOAA snapshots
        run: |
          set -euxo pipefail
          python scripts/update_data_foundation.py

      - name: Commit new snapshots
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/foundation
          if git diff --cached --quiet; then
            echo "No new NOAA snapshot to commit."
            exit 0
          fi
          git commit -m "data: update NOAA ENSO foundation snapshots"
          git push
