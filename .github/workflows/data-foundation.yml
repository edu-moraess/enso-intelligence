name: ENSO Data Foundation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Ingest and validate NOAA datasets
        run: python scripts/update_data_foundation.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/foundation
          if git diff --cached --quiet; then
            echo "No new NOAA snapshot to commit."
            exit 0
          fi
          git commit -m "data: update NOAA ENSO foundation snapshots"
          git push
