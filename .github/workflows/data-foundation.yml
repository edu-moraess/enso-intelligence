name: ENSO Data Foundation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/data-foundation.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: enso-data-foundation
  cancel-in-progress: false

jobs:
  update-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Ingest and validate NOAA datasets
        run: python scripts/update_data_foundation.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/foundation
          if git diff --cached --quiet; then
            echo "No new NOAA snapshot to commit."
            exit 0
          fi
          git commit -m "data: update NOAA ENSO foundation snapshots"
          git push
