name: Train ENSO ML outlook

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and benchmark
        run: python scripts/train_enso_ml.py --output-dir models

      - name: Publish model metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/benchmark.json models/metadata.json models/roni_forecast.joblib
          if git diff --cached --quiet; then
            echo "No ML model update to publish."
            exit 0
          fi
          git commit -m "chore: refresh ENSO ML outlook"
          git push origin HEAD:${GITHUB_REF_NAME}
